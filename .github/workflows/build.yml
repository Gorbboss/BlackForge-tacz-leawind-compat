name: Build Forge Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Verify Gradle version
        run: gradle --version

      - name: Build mod
        run: gradle build --stacktrace

      - name: List produced JARs
        run: |
          echo "Files produced by Gradle:"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlackForge-TaCZ-Leawind-Camera-Compat
          path: build/libs/*.jar
          if-no-files-found: error
